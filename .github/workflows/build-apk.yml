name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP structure
        run: |
          unzip -o *.zip
          # Encuentra el directorio real donde está build.gradle
          TARGET_DIR=$(dirname $(find . -maxdepth 3 -name "build.gradle" | head -n 1))
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verificador-niv-app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
