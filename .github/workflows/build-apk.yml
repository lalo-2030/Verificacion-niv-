name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -o *.zip
          HTML_PATH=$(find . -name "index.html" | head -n 1)
          JAVA_PATH=$(find . -name "MainActivity.java" | head -n 1)
          
          mkdir -p /tmp/extracted_assets /tmp/extracted_java
          [ -n "$HTML_PATH" ] && cp "$HTML_PATH" /tmp/extracted_assets/index.html || true
          [ -n "$JAVA_PATH" ] && cp "$JAVA_PATH" /tmp/extracted_java/MainActivity.java || true

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate Clean Android Project
        run: |
          # Limpiar raíz
          rm -f build.gradle settings.gradle gradlew
          rm -rf app

          # Crear estructura
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/sicniv/app
          mkdir -p app/src/main/res/values

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sicniv.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Verificador NIV"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name="com.sicniv.app.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:category="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.sicniv.app"
                  minSdkVersion 24
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # Copiar archivos fuente del usuario
          [ -f /tmp/extracted_assets/index.html ] && cp /tmp/extracted_assets/index.html app/src/main/assets/ || true
          [ -f /tmp/extracted_java/MainActivity.java ] && cp /tmp/extracted_java/MainActivity.java app/src/main/java/com/sicniv/app/ || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verificador-niv-app-debug
          path: app/build/outputs/apk/debug/*.apk
          
