name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP structure
        run: |
          unzip -o *.zip
          # Mueve los archivos si están dentro de la subcarpeta extraída
          if [ -d "SIC-NIV-STITCH-ANDROID-PROYECTO" ]; then
            shopt -s dotglob
            mv SIC-NIV-STITCH-ANDROID-PROYECTO/* . || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verificador-niv-app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
